<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TagNote - Регистрация</title>
</head>
<body>
<h1>📝 Регистрация</h1>

<div id="msg"></div>

<form id="registerForm">
    <div>
        <label>Логин:</label><br>
        <input type="text" id="username" required>
    </div>
    <br>
    <div>
        <label>Email:</label><br>
        <input type="email" id="email" required>
    </div>
    <br>
    <div>
        <label>Пароль:</label><br>
        <input type="password" id="password" required>
    </div>
    <br>
    <button type="submit">Зарегистрироваться</button>
    <button type="button" onclick="location.href='/login.html'">Назад ко входу</button>
</form>

<script>
    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
        });

        if (response.ok) {
            document.getElementById('msg').innerHTML = '<p style="color:green;">✅ Регистрация успешна! Перенаправляем...</p>';
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 2000);
        } else {
            const data = await response.json();
            document.getElementById('msg').innerHTML = '<p style="color:red;">❌ ' + (data.message || 'Ошибка') + '</p>';
        }
    };
</script>
</body>
</html>
